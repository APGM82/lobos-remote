<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Lobos de Castronegro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header>
        <div>
            <div class="header">
                <a href="../../index.html">
                    <img alt="Inicio" src="../public/logo.png">
                    <h1> Lobos de Castronegro</h1>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div id="loginError" class="error disabled">
            <h1>Ha sucedido un error</h1>
            <p id="errorText">Error al iniciar sesión.</p>
        </div>
        
        <div id="loginContainer">
            <div class="title">
                <h1>Login</h1>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Ingrese su correo" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Iniciar sesión</button>
                
                <div class="links">
                    <a href="#" id="forgotPassword">¿Olvidaste tu contraseña?</a>
                    <button type="button" class="btn btn-secondary" id="createAccount">Crear cuenta</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div>
            <p>© 2024 Lobos de Castronegro. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script type="module" src="../ts/login.ts"></script>
</body>
</html>
