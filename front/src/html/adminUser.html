<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Administrar Usuarios</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/adminUser.css">
</head>
    <body>
        <header>
            <div>
                <div class="header">
                    <a href="../../index.html">
                        <img alt="Inicio" src="../public/logo.png">
                        <h1> Lobos de Castronegro</h1>
                    </a>
                </div>

            </div>
        </header>

        <main>
            <div id="usersError" class="error disabled">
                <h1>Ha sucecido un error</h1>
                <p id="errorText">No se han podido encontrar usuarios.</p>
            </div>
            <div id="usersContainer">
                <div class="title">
                    <h1>Administrar usuarios</h1>
                </div>
                <div>
                    <button id="addUserBtn" class="btn success">Agregar usuario</button>
                </div>
                <div>
                    <table>
                        <thead>
                        <tr>
                            <th class="w-10">IMG</th>
                            <th class="w-30">Nombre</th>
                            <th class="w-20">NickName</th>
                            <th class="w-20">Email</th>
                            <th class="w-20">Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="usersTable">

                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer>
            <div>
                <div>
                    <p> Copyright © 2025 · Los Hombres Lobo de Castronegro</p>
                </div>
                <div class="contenedor">
                    Contacto: los4mosqueperros@gmail.com
                </div>
                <div class="contenedor">
                    <div class="contenedor-redes">
                        <a href="https://www.facebook.com/?locale=es_ES">
                            <img src="https://img.icons8.com/?size=100&id=87311&format=png&color=CDD6D0" alt="Facebook" class="redes">
                        </a>
                    </div>
                    <div class="contenedor-redes">
                        <a href="https://www.instagram.com/?hl=es">
                            <img src="https://img.icons8.com/?size=100&id=TRVfmt9zm5vL&format=png&color=CDD6D0" alt="Instagram" class="redes">
                        </a>
                    </div>
                    <div class="contenedor-redes">
                        <a href="https://x.com/?lang=es">
                            <img src="https://img.icons8.com/?size=100&id=fJp7hepMryiw&format=png&color=CDD6D0" alt="Twitter" class="redes">
                        </a>
                    </div>
                </div>
            </div>
        </footer>
        <script src="../ts/adminUser/MainUser.ts" type="module"></script>
    </body>
</html>
